name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Unit tests (no live browser)
        run: uv run --with pytest python -m pytest tests/unit -q
