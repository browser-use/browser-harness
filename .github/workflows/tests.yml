name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e . pytest==8.3.5
      # ubuntu-latest ships google-chrome, so the live BH_CDP_DENY probes run too.
      - name: Unit and integration tests
        run: python -m pytest tests -q
